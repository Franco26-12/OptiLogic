# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/optilogic_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=optilogic_user
spring.datasource.password=MiPass123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Configuración del servidor
server.port=8080
server.servlet.context-path=/api

# Configuración JWT (propiedades personalizadas)
app.jwt.secret=OptiLogicSecretKey2024SecureApplicationForLogistics
app.jwt.expiration=86400000

# Configuración de CORS (propiedades personalizadas)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Configuración de logs
logging.level.com.proyecto.OptiLogic=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Configuración de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson configuración
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
